version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: life_game_db
    environment:
      POSTGRES_USER: gameuser
      POSTGRES_PASSWORD: gamepass
      POSTGRES_DB: life_game_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gameuser"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

